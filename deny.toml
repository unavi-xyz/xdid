[advisories]
version = 2
yanked  = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Mozilla CA root bundle, via webpki-root-certs.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
version = 2

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[sources]
unknown-git      = "deny"
unknown-registry = "deny"
