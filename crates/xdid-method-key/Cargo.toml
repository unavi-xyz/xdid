[package]
description          = "xdid implementation of did:key"
edition.workspace    = true
license.workspace    = true
name                 = "xdid-method-key"
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[features]
default = ["p256", "p384"]
p256    = ["dep:p256", "jose-jwk/p256"]
p384    = ["dep:p384", "jose-jwk/p384"]

[dependencies]
jose-jwk.workspace  = true
multibase           = "0.9.2"
p256                = { features = ["jwk"], optional = true, version = "0.13.2" }
p384                = { features = ["jwk"], optional = true, version = "0.13.1" }
smallvec            = "1.15.1"
thiserror.workspace = true
xdid-core           = { path = "../xdid-core", version = "0.9.0" }
zeroize             = "1.8.2"

[dev-dependencies]
serde_json.workspace = true
