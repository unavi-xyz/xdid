[package]
description          = "xdid implementation of did:web"
edition.workspace    = true
license.workspace    = true
name                 = "xdid-method-web"
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[features]
default       = ["tls-ring"]
tls-aws-lc-rs = ["rustls/aws_lc_rs"]
tls-ring      = ["rustls/ring"]

[dependencies]
percent-encoding = "2.3.2"
reqwest = { default-features = false, features = [
  "charset",
  "http2",
  "rustls-no-provider",
  "stream",
  "system-proxy",
], version = "0.13.2" }
serde_json.workspace = true
thiserror.workspace = true
xdid-core = { path = "../xdid-core", version = "0.8.0" }

[target.'cfg(target_family = "wasm")'.dependencies]
send_wrapper = { features = ["futures"], version = "0.6.0" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustls                   = { default-features = false, features = ["std", "tls12"], version = "0.23" }
rustls-platform-verifier = "0.7.0"
tokio                    = { features = ["net", "time"], version = "1.53.1" }
